# Supabase CLI configuration. Run `supabase init` defaults for anything not set here.
project_id = "gym-coach"

[db]
major_version = 16

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]

[functions.generate-profile]
verify_jwt = true

[functions.generate-program]
verify_jwt = true
